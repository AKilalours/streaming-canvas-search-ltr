# Local OpenSearch for the hybrid (BM25 + kNN) retrieval path.
#   docker compose -f docker/opensearch.compose.yml up -d
# Single node, security plugin off: local evaluation only, never a deployment template.
services:
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: streamlens-opensearch
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      nofile:  { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  opensearch-data:
